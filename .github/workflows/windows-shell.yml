name: Windows Shell build
# pc.py finds the run for a sha by this name.
run-name: windows shell ${{ inputs.ref }}

# Builds windows/HerdrShell off the gaming PC: Windows App Control on the PC
# blocks cargo's freshly linked build-script exes, so the PC only copies the
# artifact (pc.py fetch + install --artifact).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit or branch to build
        required: true
        default: main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: windows/HerdrShell -> target

      - name: npm ci
        working-directory: windows/HerdrShell/app
        run: npm ci

      - name: Icons
        working-directory: windows/HerdrShell/app/src-tauri
        run: npx tauri icon icons/source.svg -o icons

      - name: tauri build
        working-directory: windows/HerdrShell/app
        env:
          HERDR_SHELL_COMMIT: ${{ steps.sha.outputs.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/windows/HerdrShell/target
        run: npx tauri build --bundles nsis

      - name: Collect
        shell: pwsh
        run: |
          $sha = '${{ steps.sha.outputs.sha }}'
          $rel = 'windows/HerdrShell/target/release'
          New-Item -ItemType Directory -Force -Path dist-shell | Out-Null
          Copy-Item "$rel/HerdrShell.exe" dist-shell/HerdrShell.exe
          $nsis = Get-ChildItem "$rel/bundle/nsis" -Filter *.exe | Select-Object -First 1
          Copy-Item $nsis.FullName "dist-shell/HerdrShell-setup-$sha.exe"
          Set-Content -NoNewline dist-shell/build-sha.txt $sha
          Get-FileHash dist-shell/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } | Set-Content dist-shell/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-shell-${{ steps.sha.outputs.sha }}
          path: dist-shell/
          retention-days: 14
