[package]
name = "herdr-shell-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Client core for the Windows Herdr Shell: wire mirror, terminal attach and JSON API clients."

# Standalone until the HerdrShell workspace exists; keeps the root herdr crate out of this build.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "herdr-shell-probe"
path = "src/bin/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match herdr's bincode major and config (`bincode::config::standard()`, serde mode).
bincode = { version = "2.0.1", features = ["serde"] }
interprocess = "2.4.2"

[target.'cfg(windows)'.dependencies]
# PeekNamedPipe: synchronous named pipes serialize reads and writes on one handle,
# so the attach loop polls for readable bytes instead of blocking in ReadFile.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }
