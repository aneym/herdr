[package]
name = "herdr-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[[bin]]
name = "HerdrShell"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
herdr-shell-core = { path = "../../core" }
base64 = "0.22"
# arboard returns raw RGBA images; png encodes them for the host clipboard API.
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
# Log pipe ownership failures without terminating the app.
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
