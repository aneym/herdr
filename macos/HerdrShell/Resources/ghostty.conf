# Ghostty config defaults for the herdr shell. At launch the app loads this file,
# then Alex's own ~/.config/ghostty/config with every keybind stripped (his cmd chords
# relay to the herdr TUI; the native shell owns chords through its menu), then forces
# background-opacity = 1: terminal panes are always opaque (P5).
# The theme pair follows the macOS appearance live; Alex's config overrides it.
theme = dark:Catppuccin Mocha,light:Catppuccin Latte
font-family = "SF Mono"
font-size = 13.5
adjust-cell-height = 8%
font-thicken = false
window-padding-x = 8
window-padding-y = 6
window-padding-color = extend
unfocused-split-opacity = 1
shell-integration = none
# Option composes characters (opt+e, e gives e-acute). Ghostty's default treats Option as Alt on a
# US layout, which turns opt+e into Alt+e and leaves no dead keys. Alex's own config overrides this
# line (macos-option-as-alt = true or left restores Alt).
macos-option-as-alt = false
confirm-close-surface = false
# Ghostty's default bindings (new tab, splits, goto_tab...) would compete with the
# app menu and herdr. Keep only copy and paste, which the menu forwards anyway.
keybind = clear
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard
